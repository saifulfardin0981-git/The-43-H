{% extends "base.html" %}

{% block title %}Group Links - 43-H{% endblock %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Group Links</h1>
    <p class="text-gray-500 dark:text-gray-400 mt-2">Access official Messenger, WhatsApp, and other community groups for this semester.</p>
</div>

<!-- Add Group Link Form (Role >= 3) -->
<div id="addGroupSection" class="hidden mb-10 bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-blue-200 dark:border-blue-900 transition-colors duration-300">
    <h2 class="text-xl font-semibold text-blue-800 dark:text-blue-300 mb-4 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.826L7.04 9.348a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.103-1.103m2.144-2.144L11 11.707m7.414 7.414a4 4 0 01-5.656 0l-4-4a4 4 0 015.656-5.656l1.103 1.103m2.144-2.144L15.414 15.414M15 11l5 5"></path></svg>
        Add New Group Link
    </h2>
    <form id="groupForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Title</label>
            <input type="text" name="title" required placeholder="e.g. Official WhatsApp Group" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Invite Link (URL)</label>
            <div class="mt-1 flex rounded-md shadow-sm">
                <input type="url" name="link" required placeholder="https://chat.whatsapp.com/..." class="flex-1 block w-full rounded-l-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-r-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Add Group
                </button>
            </div>
        </div>
    </form>
</div>

<div id="groupsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Group Cards will be injected here -->
    <div class="animate-pulse bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-100 dark:border-gray-700 h-32"></div>
    <div class="animate-pulse bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-100 dark:border-gray-700 h-32"></div>
    <div class="animate-pulse bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-100 dark:border-gray-700 h-32"></div>
</div>

<script>
    let currentUserRole = 1;
    let currentSemesterId = null;

    async function initialize() {
        await checkRole();
        await fetchCurrentSemester();
        await loadGroups();
    }

    async function checkRole() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) {
                const user = await res.json();
                currentUserRole = user.role;
                if (currentUserRole >= 3) document.getElementById('addGroupSection').classList.remove('hidden');
            }
        } catch (e) { console.error(e); }
    }

    async function fetchCurrentSemester() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/semesters/current', { headers: { 'Authorization': `Bearer ${token}` } });
            const sem = await res.json();
            currentSemesterId = sem.id;
        } catch (e) { console.error(e); }
    }

    async function loadGroups() {
        const token = localStorage.getItem('token');
        const container = document.getElementById('groupsContainer');
        
        try {
            const res = await fetch('/api/groups/', { headers: { 'Authorization': `Bearer ${token}` } });
            const groups = await res.json();
            
            if (groups.length === 0) {
                container.innerHTML = '<div class="col-span-full bg-white p-10 rounded-lg shadow-sm border border-dashed border-gray-300 text-center text-gray-500 italic">No group links shared for this semester.</div>';
                return;
            }

            container.innerHTML = groups.map(g => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between hover:shadow-md transition-all group relative">
                    ${currentUserRole >= 3 ? `
                        <button onclick="deleteGroup(${g.id})" class="absolute top-4 right-4 text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity p-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    ` : ''}
                    <div class="mb-4">
                        <h3 class="text-xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors line-clamp-1 pr-8">${g.title}</h3>
                    </div>
                    <a href="${g.link}" target="_blank" class="inline-flex items-center justify-center px-4 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg text-sm font-bold transition-colors">
                        Join Group
                        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </div>
            `).join('');
        } catch (e) { console.error(e); }
    }

    document.getElementById('groupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('token');
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        data.semester_id = currentSemesterId;

        try {
            const res = await fetch('/api/groups/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                e.target.reset();
                loadGroups();
            }
        } catch (e) { console.error(e); }
    });

    async function deleteGroup(id) {
        if (!confirm('Delete this group link?')) return;
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`/api/groups/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) loadGroups();
        } catch (e) { console.error(e); }
    }

    initialize();
</script>
{% endblock %}
