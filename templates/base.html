<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}43-H{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <nav class="bg-blue-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold">43-H</a>
            <div class="flex items-center space-x-6">
                <div id="navLinks" class="hidden space-x-4">
                    <a href="/dashboard" class="hover:text-blue-200">Dashboard</a>
                    <a href="/directory" class="hover:text-blue-200">Student Directory</a>
                </div>
                {% block nav %}{% endblock %}
            </div>
        </div>
    </nav>

    <script>
        // Check for token to show/hide navigation
        const token = localStorage.getItem('token');
        if (token) {
            document.getElementById('navLinks')?.classList.remove('hidden');
        } else {
            console.log("No token found in localStorage");
        }

        function logout() {
            console.log("Logging out...");
            localStorage.removeItem('token');
            window.location.href = '/login';
        }
    </script>

    <main class="container mx-auto flex-grow p-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 p-6 text-white text-center">
        <div class="mb-4">
            <!-- Minimal Ad Placeholder -->
            <div id="ad-placeholder" class="bg-gray-700 p-4 inline-block rounded text-gray-400">
                <p>Advertisement Space</p>
                <!-- Add script tag here in the future -->
                {% block ad_script %}{% endblock %}
            </div>
        </div>
        <p>&copy; 2026 43-H. All rights reserved.</p>
    </footer>
</body>
</html>
