<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}43-H{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .sidebar-link-active {
            background-color: #2563eb;
            color: white;
        }
        /* Custom scrollbar for dark mode */
        .dark ::-webkit-scrollbar { width: 8px; }
        .dark ::-webkit-scrollbar-track { background: #1f2937; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
    <script>
        // Check local storage or system preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex flex-col md:flex-row overflow-x-hidden transition-colors duration-300">
    <!-- Sidebar Backdrop (Mobile only) -->
    <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white flex flex-col z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl">
        <div class="p-6 border-b border-gray-800 flex items-center justify-between">
            <a href="/dashboard" class="text-2xl font-bold tracking-wider text-blue-400">43-H</a>
            <!-- Close button for mobile -->
            <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l18 18"></path></svg>
            </button>
        </div>
        
        <nav class="flex-grow px-4 py-6 space-y-2 overflow-y-auto">
            <a href="/dashboard" id="menu-dashboard" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="/resources" id="menu-resources" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span>Resource Hub</span>
            </a>
            <a href="/groups" id="menu-groups" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.826L7.04 9.348a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.103-1.103m2.144-2.144L11 11.707m7.414 7.414a4 4 0 01-5.656 0l-4-4a4 4 0 015.656-5.656l1.103 1.103m2.144-2.144L15.414 15.414M15 11l5 5"></path></svg>
                <span>Group Links</span>
            </a>
            <a href="/directory" id="menu-directory" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span>Student Directory</span>
            </a>
            <a href="/profile" id="menu-profile" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span>My Profile</span>
            </a>
        </nav>

        <div class="p-4 border-t border-gray-800">
            <button onclick="logout()" class="flex items-center space-x-3 w-full p-3 rounded-lg hover:bg-red-900 text-red-400 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-grow flex flex-col min-w-0 md:ml-64 bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-300">
        <!-- Top Navbar (Desktop & Mobile) -->
        <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 h-16 flex items-center px-4 md:px-8 justify-between sticky top-0 z-30 shadow-sm transition-colors duration-300">
            <div class="flex items-center space-x-4">
                <!-- Hamburger Menu Button (Mobile Only) -->
                <button id="mobileMenuBtn" onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                {% block nav %}{% endblock %}
                <div id="globalSemesterDisplay" class="hidden md:flex items-center text-xs font-bold text-blue-800 dark:text-blue-200 bg-blue-100 dark:bg-blue-900 px-3 py-1 rounded-full uppercase tracking-wider">
                    <!-- Semester will load here -->
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <!-- Theme Toggle Button -->
                <button onclick="toggleTheme()" class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors focus:outline-none" title="Toggle Dark/Light Mode">
                    <svg id="theme-icon-dark" class="hidden w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg id="theme-icon-light" class="hidden w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <div id="userDisplay" class="text-sm font-medium text-gray-600 dark:text-gray-300 truncate max-w-[150px] sm:max-w-none"></div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="flex-grow p-4 md:p-8">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="bg-white dark:bg-gray-800 border-t dark:border-gray-700 p-6 text-center text-gray-500 dark:text-gray-400 text-sm transition-colors duration-300">
            <!-- Ad Container (Controlled by Global & User Settings) -->
            <div id="ad-container" class="mb-4 hidden">
                {% if global_ads_enabled %}
                <!-- BEGIN AADS AD UNIT 2438598 -->
                <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 10;">
                    <iframe data-aa='2438598' src='//acceptable.a-ads.com/2438598/?size=Adaptive'
                            style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
                </div>
                <!-- END AADS AD UNIT 2438598 -->
                {% endif %}
            </div>
            <p>&copy; 2026 43-H (Section H, 43rd Batch). Built with ❤️ for DIU students.</p>
        </footer>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const currentPath = window.location.pathname;
        const globalAdsEnabled = {{ global_ads_enabled | lower }};

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-icon-dark').classList.toggle('hidden', isDark);
            document.getElementById('theme-icon-light').classList.toggle('hidden', !isDark);
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcons();
        }

        async function initBase() {
            updateThemeIcons();
            if (token) {
                // Initial check for mobile sidebar state is handled by CSS classes
                
                try {
                    const [res, semRes] = await Promise.all([
                        fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } }),
                        fetch('/api/semesters/current', { headers: { 'Authorization': `Bearer ${token}` } })
                    ]);
                    
                    if (semRes.ok) {
                        const currentSem = await semRes.json();
                        const semDisplay = document.getElementById('globalSemesterDisplay');
                        if (semDisplay) {
                            semDisplay.textContent = `Active Semester: ${currentSem.name}`;
                            semDisplay.classList.remove('hidden');
                        }
                    }

                    if (res.ok) {
                        const user = await res.json();
                        document.getElementById('userDisplay').textContent = `${user.name} (${user.student_id})`;
                        
                        // Handle Ad Display Logic
                        if (globalAdsEnabled && user.ads_enabled !== false) {
                            document.getElementById('ad-container').classList.remove('hidden');
                        }
                        
                        // Handle Access Control for Role 1
                        if (user.role === 1) {
                            const restricted = ['menu-dashboard', 'menu-directory'];
                            restricted.forEach(id => {
                                const el = document.getElementById(id);
                                if (el) {
                                    el.classList.add('opacity-30', 'pointer-events-none');
                                    el.setAttribute('href', '#');
                                }
                            });
                            // If they are on a restricted page, move them to resources
                            if (currentPath === '/dashboard' || currentPath === '/directory') {
                                window.location.href = '/resources';
                            }
                        }
                    } else if (res.status === 401) {
                        logout();
                    }
                } catch (e) {
                    console.error("Auth check failed", e);
                }
            } else if (currentPath !== '/login' && currentPath !== '/') {
                window.location.href = '/login';
            }

            // Mark active menu
            const menuMap = {
                '/dashboard': 'menu-dashboard',
                '/resources': 'menu-resources',
                '/directory': 'menu-directory',
                '/profile': 'menu-profile'
            };
            
            // Default to dashboard if we're on the dashboard or root
            let activeId = menuMap[currentPath];
            if (currentPath === '/' || currentPath === '/login') activeId = null; 
            else if (!activeId && currentPath === '/dashboard') activeId = 'menu-dashboard';
            
            if (activeId) {
                document.getElementById(activeId)?.classList.add('sidebar-link-active');
            } else if (currentPath.includes('dashboard')) {
                 document.getElementById('menu-dashboard')?.classList.add('sidebar-link-active');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            
            const isOpen = !sidebar.classList.contains('-translate-x-full');
            
            if (isOpen) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login';
        }

        initBase();
    </script>
</body>
</html>
