{% extends "base.html" %}

{% block title %}Academic Resource Hub - 43-H{% endblock %}

{% block content %}
<div class="mb-8 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
    <div>
        <h1 class="text-3xl font-bold text-gray-900">Academic Resource Hub</h1>
        <p class="text-gray-500 mt-2">Explore lecture materials, notes, and links organized by course.</p>
    </div>
    <div class="flex items-center space-x-2">
        <label for="semesterFilter" class="text-sm font-semibold text-gray-600">Semester:</label>
        <select id="semesterFilter" onchange="loadCourses(this.value)" class="block w-48 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border bg-white">
            <option value="">Loading...</option>
        </select>
    </div>
</div>

<!-- Add Course Form (Role >= 3) -->
<div id="addCourseSection" class="hidden mb-10 bg-white p-6 rounded-lg shadow-sm border border-blue-200">
    <h2 id="courseFormTitle" class="text-xl font-semibold text-blue-800 mb-4 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        Add New Course
    </h2>
    <form id="courseForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="hidden" name="course_id" id="edit_course_id">
        <div>
            <label class="block text-sm font-medium text-gray-700">Course Code</label>
            <input type="text" name="code" id="course_code" required placeholder="e.g., SWE112" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Course Name</label>
            <input type="text" name="name" id="course_name" required placeholder="e.g., Software Engineering" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div class="flex items-end space-x-2">
            <button type="submit" id="courseSubmitBtn" class="flex-1 bg-blue-600 text-white py-2 px-6 rounded-md hover:bg-blue-700 transition-colors font-medium">
                Create Course
            </button>
            <button type="button" id="cancelCourseEditBtn" onclick="cancelCourseEdit()" class="hidden bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600 transition-colors font-medium">
                Cancel
            </button>
        </div>
    </form>
</div>

<div id="coursesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Course Cards will be injected here -->
    <div class="animate-pulse bg-white p-6 rounded-xl border border-gray-200 h-40"></div>
    <div class="animate-pulse bg-white p-6 rounded-xl border border-gray-200 h-40"></div>
    <div class="animate-pulse bg-white p-6 rounded-xl border border-gray-200 h-40"></div>
</div>

<script>
    let currentUserRole = 1;
    let selectedSemesterId = null;
    let allCourses = [];

    async function initializePage() {
        await checkRole();
        await loadSemesters();
    }

    async function checkRole() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const user = await res.json();
                currentUserRole = user.role;
                if (currentUserRole >= 3) {
                    document.getElementById('addCourseSection').classList.remove('hidden');
                }
            }
        } catch (error) { console.error('Error checking role:', error); }
    }

    async function loadSemesters() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/semesters/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const semesters = await res.json();
            const filterSelect = document.getElementById('semesterFilter');
            
            let currentCode = '';
            filterSelect.innerHTML = semesters.map(sem => {
                if (sem.is_current) {
                    currentCode = sem.code;
                    selectedSemesterId = sem.id;
                }
                return `<option value="${sem.code}" data-id="${sem.id}" ${sem.is_current ? 'selected' : ''}>${sem.name}</option>`;
            }).join('');

            if (currentCode) loadCourses(currentCode);
        } catch (error) { console.error('Error loading semesters:', error); }
    }

    async function loadCourses(semesterCode) {
        const token = localStorage.getItem('token');
        const filterSelect = document.getElementById('semesterFilter');
        const semId = filterSelect.options[filterSelect.selectedIndex].dataset.id;
        selectedSemesterId = semId;

        document.getElementById('coursesContainer').innerHTML = `
            <div class="animate-pulse bg-white p-6 rounded-xl border border-gray-200 h-40"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl border border-gray-200 h-40"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl border border-gray-200 h-40"></div>
        `;

        try {
            const res = await fetch(`/api/courses/?semester_id=${semId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            allCourses = await res.json();
            const container = document.getElementById('coursesContainer');

            if (allCourses.length === 0) {
                container.innerHTML = '<div class="col-span-full bg-white p-10 rounded-lg shadow-sm border border-dashed border-gray-300 text-center text-gray-500 italic">No courses added for this semester yet.</div>';
                return;
            }

            container.innerHTML = allCourses.map(course => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between hover:shadow-md transition-all hover:-translate-y-1 group cursor-pointer" onclick="window.location.href='/course/${course.id}'">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase tracking-wider">${course.code}</span>
                            ${currentUserRole >= 3 ? `
                                <div class="flex space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="event.stopPropagation(); editCourse(${course.id})" class="text-blue-500 hover:text-blue-700 p-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                    </button>
                                    <button onclick="event.stopPropagation(); deleteCourse(${course.id})" class="text-red-400 hover:text-red-600 p-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        <h3 class="text-xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors">${course.name}</h3>
                    </div>
                    <div class="mt-6 flex items-center text-sm font-medium text-gray-400">
                        <span>View Resources</span>
                        <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                    </div>
                </div>
            `).join('');
        } catch (error) { console.error('Error loading courses:', error); }
    }

    function editCourse(id) {
        const course = allCourses.find(c => c.id === id);
        if (!course) return;
        document.getElementById('edit_course_id').value = course.id;
        document.getElementById('course_code').value = course.code;
        document.getElementById('course_name').value = course.name;
        document.getElementById('courseFormTitle').textContent = 'Edit Course';
        document.getElementById('courseSubmitBtn').textContent = 'Update Course';
        document.getElementById('cancelCourseEditBtn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelCourseEdit() {
        document.getElementById('courseForm').reset();
        document.getElementById('edit_course_id').value = '';
        document.getElementById('courseFormTitle').textContent = 'Add New Course';
        document.getElementById('courseSubmitBtn').textContent = 'Create Course';
        document.getElementById('cancelCourseEditBtn').classList.add('hidden');
    }

    document.getElementById('courseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('token');
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        const courseId = data.course_id;
        delete data.course_id;

        const url = courseId ? `/api/courses/${courseId}` : '/api/courses/';
        const method = courseId ? 'PATCH' : 'POST';
        if (!courseId) data.semester_id = parseInt(selectedSemesterId);

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                cancelCourseEdit();
                loadCourses(document.getElementById('semesterFilter').value);
            }
        } catch (error) { console.error('Error saving course:', error); }
    });

    async function deleteCourse(id) {
        if (!confirm('Delete this course and all its resources?')) return;
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`/api/courses/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) loadCourses(document.getElementById('semesterFilter').value);
        } catch (error) { console.error('Error deleting course:', error); }
    }

    initializePage();
</script>
{% endblock %}
