{% extends "base.html" %}

{% block title %}Academic Resource Hub - 43-H{% endblock %}

{% block content %}
<div class="mb-8 flex justify-between items-center">
    <div>
        <h1 class="text-3xl font-bold text-gray-900">Academic Resource Hub</h1>
        <p class="text-gray-500 mt-2">Access lecture slides, books, and other study materials organized by subject.</p>
    </div>
</div>

<!-- Add Resource Form (Role >= 3) -->
<div id="addResourceSection" class="hidden mb-10 bg-white p-6 rounded-lg shadow-sm border border-blue-200">
    <h2 class="text-xl font-semibold text-blue-800 mb-4 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Add New Resource
    </h2>
    <form id="resourceForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Title</label>
            <input type="text" name="title" required placeholder="e.g., Chapter 1 Slides" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Subject</label>
            <input type="text" name="subject" required placeholder="e.g., Software Engineering" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Link (URL)</label>
            <input type="url" name="link" required placeholder="https://drive.google.com/..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div class="md:col-span-3 flex justify-end mt-2">
            <button type="submit" class="bg-blue-600 text-white py-2 px-6 rounded-md hover:bg-blue-700 transition-colors font-medium">
                Upload Resource
            </button>
        </div>
    </form>
</div>

<div id="resourcesContainer" class="space-y-8">
    <!-- Resources grouped by subject will be injected here -->
    <div class="animate-pulse space-y-4">
        <div class="h-6 bg-gray-200 rounded w-1/4 mb-4"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="h-32 bg-gray-200 rounded-lg"></div>
            <div class="h-32 bg-gray-200 rounded-lg"></div>
            <div class="h-32 bg-gray-200 rounded-lg"></div>
        </div>
    </div>
</div>

<script>
    let currentUserRole = 1;

    async function checkRoleAndLoad() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const user = await res.json();
                currentUserRole = user.role;
                if (currentUserRole >= 3) {
                    document.getElementById('addResourceSection').classList.remove('hidden');
                }
            }
            loadResources();
        } catch (error) {
            console.error('Error checking role:', error);
            loadResources(); // Attempt to load anyway
        }
    }

    async function loadResources() {
        const token = localStorage.getItem('token');
        try {
            const response = await fetch('/api/resources/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const resources = await response.json();
            const container = document.getElementById('resourcesContainer');
            
            if (resources.length === 0) {
                container.innerHTML = '<div class="bg-white p-10 rounded-lg shadow-sm border border-dashed border-gray-300 text-center text-gray-500 italic">No resources have been uploaded yet.</div>';
                return;
            }

            // Group resources by subject
            const groupedResources = resources.reduce((acc, resource) => {
                const subject = resource.subject || 'Uncategorized';
                if (!acc[subject]) {
                    acc[subject] = [];
                }
                acc[subject].push(resource);
                return acc;
            }, {});

            // Generate HTML for each subject group
            let html = '';
            for (const [subject, items] of Object.entries(groupedResources)) {
                html += `
                    <div class="mb-8">
                        <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-200 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            ${subject}
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${items.map(item => `
                                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 flex flex-col justify-between hover:shadow-md transition-shadow group">
                                    <div>
                                        <div class="flex justify-between items-start">
                                            <h3 class="font-bold text-gray-900 mb-1 line-clamp-2" title="${item.title}">${item.title}</h3>
                                            ${currentUserRole >= 3 ? `
                                                <button onclick="deleteResource(${item.id})" class="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity ml-2 flex-shrink-0" title="Delete Resource">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                </button>
                                            ` : ''}
                                        </div>
                                        <p class="text-xs text-gray-500 mb-4">Added by ${item.author_name} • ${new Date(item.created_at).toLocaleDateString()}</p>
                                    </div>
                                    <a href="${item.link}" target="_blank" class="inline-flex items-center justify-center w-full px-4 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 hover:text-blue-800 rounded-md text-sm font-medium transition-colors">
                                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                        Download / View
                                    </a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;

        } catch (error) {
            console.error('Error loading resources:', error);
            document.getElementById('resourcesContainer').innerHTML = `<p class="text-red-500 text-center p-4 bg-red-50 rounded-lg border border-red-100">Failed to load resources. Please try again later.</p>`;
        }
    }

    document.getElementById('resourceForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('/api/resources/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                e.target.reset();
                loadResources();
            } else {
                const err = await response.json();
                alert('Failed to add resource: ' + (err.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error adding resource:', error);
        }
    });

    async function deleteResource(id) {
        if (!confirm('Are you sure you want to delete this resource?')) return;
        const token = localStorage.getItem('token');
        try {
            const response = await fetch(`/api/resources/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                loadResources();
            } else {
                alert('Failed to delete resource.');
            }
        } catch (error) {
            console.error('Error deleting resource:', error);
        }
    }

    // Initialize
    checkRoleAndLoad();
</script>
{% endblock %}
