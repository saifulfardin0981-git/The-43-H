{% extends "base.html" %}

{% block title %}Course Detail - 43-H{% endblock %}

{% block content %}
<div class="mb-8">
    <a href="/resources" class="inline-flex items-center text-sm font-medium text-blue-600 hover:text-blue-800 mb-4 group transition-colors">
        <svg class="w-4 h-4 mr-1 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
        Back to Hub
    </a>
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <div id="courseBadge" class="inline-block px-2 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded uppercase tracking-widest mb-2">Loading...</div>
            <h1 id="courseName" class="text-3xl font-bold text-gray-900">Loading Course...</h1>
        </div>
    </div>
</div>

<!-- Add Resource Form (Role >= 3) -->
<div id="addResourceSection" class="hidden mb-10 bg-white p-6 rounded-lg shadow-sm border border-blue-200">
    <h2 class="text-xl font-semibold text-blue-800 mb-4 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Add New Resource
    </h2>
    <form id="resourceForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="md:col-span-1">
            <label class="block text-sm font-medium text-gray-700">Category</label>
            <select name="category" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border bg-white">
                <option value="Shared Link">Shared Link</option>
                <option value="BLC Link">BLC Link</option>
                <option value="Notes">Notes</option>
                <option value="Slides">Slides</option>
                <option value="Book">Book</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="md:col-span-1">
            <label class="block text-sm font-medium text-gray-700">Title</label>
            <input type="text" name="title" required placeholder="e.g. Chapter 1 PDF" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">Link (URL)</label>
            <input type="url" name="link" required placeholder="https://..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div class="md:col-span-4 flex justify-end mt-2">
            <button type="submit" class="bg-blue-600 text-white py-2 px-6 rounded-md hover:bg-blue-700 transition-colors font-medium">
                Add Resource
            </button>
        </div>
    </form>
</div>

<!-- Tab Navigation -->
<div class="flex space-x-2 mb-8 border-b border-gray-200 pb-px overflow-x-auto">
    <button onclick="switchCategory('All')" id="tab-All" class="category-tab px-4 py-2 text-sm font-bold transition-all border-b-2 border-blue-600 text-blue-600">All Resources</button>
    <button onclick="switchCategory('Shared Link')" id="tab-SharedLink" class="category-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 transition-all border-b-2 border-transparent">Shared Links</button>
    <button onclick="switchCategory('BLC Link')" id="tab-BLCLink" class="category-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 transition-all border-b-2 border-transparent">BLC Links</button>
    <button onclick="switchCategory('Notes')" id="tab-Notes" class="category-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 transition-all border-b-2 border-transparent">Notes</button>
    <button onclick="switchCategory('Slides')" id="tab-Slides" class="category-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 transition-all border-b-2 border-transparent">Slides</button>
</div>

<div id="resourcesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <!-- Resources will be injected here -->
</div>

<script>
    const courseId = {{ course_id }};
    let currentUserRole = 1;
    let currentSemesterId = null;
    let allResources = [];
    let activeCategory = 'All';

    async function initialize() {
        await checkRole();
        await loadCourseInfo();
        await loadResources();
    }

    async function checkRole() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
            if (res.ok) {
                const user = await res.json();
                currentUserRole = user.role;
                if (currentUserRole >= 3) document.getElementById('addResourceSection').classList.remove('hidden');
            }
        } catch (e) { console.error(e); }
    }

    async function loadCourseInfo() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`/api/courses/${courseId}`, { headers: { 'Authorization': `Bearer ${token}` } });
            const course = await res.json();
            if (res.ok) {
                document.getElementById('courseBadge').textContent = course.code;
                document.getElementById('courseName').textContent = course.name;
                selectedSemesterId = course.semester_id;
                currentSemesterId = course.semester_id;
            }
        } catch (e) { console.error(e); }
    }

    async function loadResources() {
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`/api/resources/?course_id=${courseId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            allResources = await res.json();
            renderResources();
        } catch (e) { console.error(e); }
    }

    function switchCategory(cat) {
        activeCategory = cat;
        // Update tab styles
        document.querySelectorAll('.category-tab').forEach(t => {
            t.classList.remove('border-blue-600', 'text-blue-600', 'font-bold');
            t.classList.add('border-transparent', 'text-gray-500', 'font-medium');
        });
        const activeTabId = `tab-${cat.replace(/\s+/g, '')}`;
        const activeTab = document.getElementById(activeTabId);
        if (activeTab) {
            activeTab.classList.remove('border-transparent', 'text-gray-500', 'font-medium');
            activeTab.classList.add('border-blue-600', 'text-blue-600', 'font-bold');
        }
        renderResources();
    }

    function renderResources() {
        const container = document.getElementById('resourcesList');
        const filtered = activeCategory === 'All' ? allResources : allResources.filter(r => r.category === activeCategory);

        if (filtered.length === 0) {
            container.innerHTML = '<div class="col-span-full bg-white p-10 rounded-lg shadow-sm border border-dashed border-gray-300 text-center text-gray-500 italic">No resources found in this category.</div>';
            return;
        }

        container.innerHTML = filtered.map(r => `
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 flex flex-col justify-between hover:shadow-md transition-shadow group relative">
                <div class="flex justify-between items-start mb-3">
                    <span class="text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded bg-gray-100 text-gray-600">${r.category}</span>
                    ${currentUserRole >= 3 ? `
                        <button onclick="deleteResource(${r.id})" class="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    ` : ''}
                </div>
                <h3 class="font-bold text-gray-800 mb-4 line-clamp-2">${r.title}</h3>
                <div class="flex items-center justify-between pt-3 border-t border-gray-50">
                    <span class="text-[10px] text-gray-400 uppercase font-medium">By ${r.author_name}</span>
                    <a href="${r.link}" target="_blank" class="text-blue-600 hover:text-blue-800">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('resourceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('token');
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        data.course_id = courseId;
        data.semester_id = currentSemesterId;

        try {
            const res = await fetch('/api/resources/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                e.target.reset();
                loadResources();
            }
        } catch (e) { console.error(e); }
    });

    async function deleteResource(id) {
        if (!confirm('Delete this resource?')) return;
        const token = localStorage.getItem('token');
        try {
            const res = await fetch(`/api/resources/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) loadResources();
        } catch (e) { console.error(e); }
    }

    initialize();
</script>
{% endblock %}
