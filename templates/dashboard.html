{% extends "base.html" %}

{% block title %}Dashboard - 43-H{% endblock %}

{% block nav %}
<button onclick="logout()" class="hover:underline">Logout</button>
{% endblock %}

{% block content %}
<div class="mb-8 flex justify-between items-center">
    <h1 class="text-3xl font-bold text-gray-900">Class Updates</h1>
    <div class="flex items-center space-x-2">
        <button id="editProfileBtn" onclick="toggleProfileSection()" class="hidden px-3 py-1 bg-gray-200 text-gray-700 rounded-md text-xs font-medium hover:bg-gray-300 transition-colors">
            Edit Profile
        </button>
        <div id="roleBadge" class="hidden px-3 py-1 rounded-full text-xs font-semibold"></div>
    </div>
</div>

<!-- Profile Section: Update Blood Group -->
<div id="profileSection" class="mb-10 bg-white p-6 rounded-lg shadow-sm border border-gray-100">
    <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
        <svg class="w-5 h-5 mr-2 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        Your Profile
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Blood Group</label>
            <select id="bloodGroupSelect" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500 sm:text-sm p-2 border">
                <option value="Unknown">Unknown</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>
        <div class="flex items-end">
            <button onclick="updateProfile()" class="w-full bg-red-600 text-white py-2 px-4 rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors">
                Update Profile
            </button>
        </div>
    </div>
</div>

<!-- Post Update Form (Hidden by default, shown for role >= 3) -->
<div id="postUpdateSection" class="hidden mb-10 bg-white p-6 rounded-lg shadow-sm border border-blue-100">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Post New Class Update</h2>
    <form id="updateForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Course Name</label>
            <input type="text" name="course_name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Date</label>
            <input type="date" name="date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">Topics Covered</label>
            <textarea name="topics_covered" rows="3" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"></textarea>
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">Resource Link (Optional)</label>
            <input type="url" name="resources_link" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
        </div>
        <div class="md:col-span-2">
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                Post Update
            </button>
        </div>
    </form>
</div>

<!-- Notice Board Section -->
<div class="mb-10 bg-white p-6 rounded-lg shadow-sm border border-orange-100">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
        <svg class="w-7 h-7 mr-2 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
        Notice Board
    </h2>

    <!-- Post Notice Form (CR/Admin only) -->
    <div id="postNoticeSection" class="hidden mb-8 bg-orange-50 p-4 rounded-md border border-orange-200">
        <h3 class="text-lg font-semibold text-orange-800 mb-3">Post New Notice</h3>
        <form id="noticeForm" class="space-y-3">
            <input type="text" name="title" placeholder="Notice Title" required class="block w-full rounded-md border-gray-300 shadow-sm focus:border-orange-500 focus:ring-orange-500 sm:text-sm p-2 border">
            <textarea name="content" rows="2" placeholder="Notice Content" required class="block w-full rounded-md border-gray-300 shadow-sm focus:border-orange-500 focus:ring-orange-500 sm:text-sm p-2 border"></textarea>
            <button type="submit" class="bg-orange-600 text-white py-2 px-4 rounded-md hover:bg-orange-700 transition-colors text-sm font-medium">
                Broadcast Notice
            </button>
        </form>
    </div>

    <div id="noticesList" class="space-y-4">
        <!-- Notices will be injected here -->
        <p class="text-gray-500 text-center italic">Loading notices...</p>
    </div>
</div>

<div id="updatesList" class="space-y-6">
    <div class="animate-pulse flex space-x-4">
        <div class="flex-1 space-y-4 py-1">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="space-y-2">
                <div class="h-4 bg-gray-200 rounded"></div>
                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
            </div>
        </div>
    </div>
</div>

<!-- Admin Section: Manage Roles -->
<div id="adminSection" class="hidden mt-12 bg-white p-6 rounded-lg shadow-sm border border-red-100">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
        <svg class="w-6 h-6 mr-2 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        Manage User Roles
    </h2>
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                </tr>
            </thead>
            <tbody id="adminUserList" class="bg-white divide-y divide-gray-200">
                <!-- User rows will be injected here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadUserAndUpdates() {
        const token = localStorage.getItem('token');
        if (!token) {
            console.warn("No token found, redirecting to login");
            window.location.href = '/login';
            return;
        }

        try {
            console.log("Fetching user info...");
            const userResponse = await fetch('/api/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (userResponse.status === 401) {
                console.error("Unauthorized: Token might be invalid or expired");
                logout(); 
                return; 
            }
            
            const user = await userResponse.json();
            console.log("User loaded:", user.email, "Role:", user.role);
            
            // Set current blood group in dropdown and hide section if already set
            const profileSection = document.getElementById('profileSection');
            const editProfileBtn = document.getElementById('editProfileBtn');
            const bloodGroupSelect = document.getElementById('bloodGroupSelect');
            if (bloodGroupSelect) {
                const bg = user.blood_group || 'Unknown';
                bloodGroupSelect.value = bg;
                if (bg !== 'Unknown') {
                    profileSection.classList.add('hidden');
                    editProfileBtn.classList.remove('hidden');
                } else {
                    profileSection.classList.remove('hidden');
                    editProfileBtn.classList.add('hidden');
                }
            }

            const badge = document.getElementById('roleBadge');
            const ROLE_NAMES = {1: 'DIU Student', 2: '43-H Student', 3: 'CR', 4: 'Admin'};
            badge.textContent = ROLE_NAMES[user.role] || 'User';
            badge.classList.remove('hidden');
            badge.classList.add(user.role >= 3 ? 'bg-purple-100' : 'bg-green-100');
            badge.classList.add(user.role >= 3 ? 'text-purple-800' : 'text-green-800');

            if (user.role >= 3) {
                document.getElementById('postUpdateSection').classList.remove('hidden');
                document.getElementById('postNoticeSection').classList.remove('hidden');
            }

            if (user.role === 4) {
                document.getElementById('adminSection').classList.remove('hidden');
                loadAdminUsers(user.email);
            }

            // Load Notices
            loadNotices(user.role >= 3);

            console.log("Fetching class updates...");
            const response = await fetch('/api/class-updates/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) {
                throw new Error(`Failed to fetch updates: ${response.status}`);
            }

            const updates = await response.json();
            const listDiv = document.getElementById('updatesList');
            
            if (updates.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500 text-center italic">No class updates available.</p>';
                return;
            }

            listDiv.innerHTML = updates.map(update => `
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-xl font-semibold text-blue-600">${update.course_name}</h2>
                        <span class="text-sm text-gray-500">${update.date}</span>
                    </div>
                    <div class="text-gray-700 mb-4">
                        <h3 class="font-medium text-gray-900 mb-1">Topics Covered:</h3>
                        <p>${update.topics_covered}</p>
                    </div>
                    ${update.resources_link ? `
                        <a href="${update.resources_link}" target="_blank" class="inline-flex items-center text-sm font-medium text-blue-600 hover:text-blue-800">
                            View Resources
                            <svg class="ml-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    ` : ''}
                </div>
            `).join('');
        } catch (error) {
            console.error('Error loading dashboard:', error);
            document.getElementById('updatesList').innerHTML = `<p class="text-red-500 text-center">Error loading updates. Please check console.</p>`;
        }
    }

    function toggleProfileSection() {
        const profileSection = document.getElementById('profileSection');
        const editProfileBtn = document.getElementById('editProfileBtn');
        if (profileSection.classList.contains('hidden')) {
            profileSection.classList.remove('hidden');
            editProfileBtn.textContent = 'Cancel Edit';
        } else {
            profileSection.classList.add('hidden');
            editProfileBtn.textContent = 'Edit Profile';
        }
    }

    async function updateProfile() {
        const token = localStorage.getItem('token');
        const bloodGroup = document.getElementById('bloodGroupSelect').value;

        try {
            const response = await fetch('/api/auth/me', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ blood_group: bloodGroup })
            });

            if (response.ok) {
                alert('Profile updated successfully!');
                loadUserAndUpdates();
            } else {
                const errData = await response.json();
                alert('Failed to update profile: ' + (errData.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error updating profile:', error);
            alert('An error occurred while updating your profile.');
        }
    }

    async function loadAdminUsers(currentAdminEmail) {
        const token = localStorage.getItem('token');
        try {
            const response = await fetch('/api/auth/admin/users', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const users = await response.json();
            const adminUserList = document.getElementById('adminUserList');
            
            adminUserList.innerHTML = users.map(user => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${user.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${user.email}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <select id="role-${user.email}" ${user.email === currentAdminEmail ? 'disabled' : ''} class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500 sm:text-sm p-1 border">
                            <option value="1" ${user.role === 1 ? 'selected' : ''}>Role 1: General Student</option>
                            <option value="2" ${user.role === 2 ? 'selected' : ''}>Role 2: 43-H Student</option>
                            <option value="3" ${user.role === 3 ? 'selected' : ''}>Role 3: CR</option>
                            <option value="4" ${user.role === 4 ? 'selected' : ''}>Role 4: Admin</option>
                        </select>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="updateUserRole('${user.email}')" ${user.email === currentAdminEmail ? 'disabled' : ''} class="${user.email === currentAdminEmail ? 'bg-gray-300 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700'} text-white py-1 px-3 rounded text-xs transition-colors">
                            Update
                        </button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('Error loading admin users:', error);
        }
    }

    async function updateUserRole(email) {
        const token = localStorage.getItem('token');
        const role = parseInt(document.getElementById(`role-${email}`).value);

        try {
            const response = await fetch(`/api/auth/users/${email}/role`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ role: role })
            });

            if (response.ok) {
                alert(`Role updated successfully for ${email}`);
                // Refresh the list to reflect changes (though it should already match the select value)
                loadUserAndUpdates(); 
            } else {
                const errData = await response.json();
                alert('Failed to update role: ' + (errData.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error updating role:', error);
            alert('An error occurred while updating the role.');
        }
    }

    // --- Notice Board Functions ---

    async function loadNotices(isCR) {
        const token = localStorage.getItem('token');
        try {
            const response = await fetch('/api/notices/', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const notices = await response.json();
            const listDiv = document.getElementById('noticesList');
            
            if (notices.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500 text-center italic">No active notices.</p>';
                return;
            }

            listDiv.innerHTML = notices.map(notice => `
                <div class="bg-orange-50 p-4 rounded-md border-l-4 border-orange-500 relative group">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-gray-900">${notice.title}</h3>
                        ${isCR ? `<button onclick="deleteNotice(${notice.id})" class="text-red-500 opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-700">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>` : ''}
                    </div>
                    <p class="text-gray-700 text-sm mt-1">${notice.content}</p>
                    <div class="mt-2 flex justify-between items-center text-[10px] text-gray-400 uppercase tracking-widest font-bold">
                        <span>By ${notice.author_name}</span>
                        <span>${new Date(notice.created_at).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error('Error loading notices:', error);
        }
    }

    document.getElementById('noticeForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('/api/notices/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                e.target.reset();
                loadUserAndUpdates(); // This will trigger loadNotices
            } else {
                const errData = await response.json();
                alert('Failed to post notice: ' + (errData.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error posting notice:', error);
        }
    });

    async function deleteNotice(id) {
        if (!confirm('Are you sure you want to delete this notice?')) return;
        const token = localStorage.getItem('token');
        try {
            const response = await fetch(`/api/notices/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                loadUserAndUpdates();
            }
        } catch (error) {
            console.error('Error deleting notice:', error);
        }
    }

    document.getElementById('updateForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        const token = localStorage.getItem('token');

        try {
            console.log("Posting new update...");
            const response = await fetch('/api/class-updates/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                console.log("Update posted successfully");
                e.target.reset();
                loadUserAndUpdates();
            } else {
                const errData = await response.json();
                console.error("Failed to post update:", errData);
                alert('Failed to post update: ' + (errData.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error posting update:', error);
            alert('An error occurred while posting the update.');
        }
    });

    loadUserAndUpdates();
</script>
{% endblock %}
