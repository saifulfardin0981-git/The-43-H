{% extends "base.html" %}

{% block title %}Login - 43-H{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 border border-gray-300 dark:border-gray-700 rounded-lg shadow-sm transition-colors duration-300">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800 dark:text-white">43-H</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-8 text-center">Please sign in with your DIU student email to access the portal.</p>
    
    <a href="/api/auth/login" 
       class="w-full flex items-center justify-center py-2 px-4 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
        <img class="h-5 w-5 mr-2" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
        Sign in with Google
    </a>
    
    <div id="message" class="mt-4 text-center text-sm"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        console.log("Login page loaded, checking for token in URL...");
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
            console.log("Token detected in URL, saving to localStorage and redirecting...");
            localStorage.setItem('token', token);
            window.location.href = '/dashboard';
        } else {
            console.log("No token found in URL.");
            // Also check if already logged in
            if (localStorage.getItem('token')) {
                console.log("Token found in localStorage, redirecting to dashboard...");
                window.location.href = '/dashboard';
            }
        }
    });
</script>
{% endblock %}
