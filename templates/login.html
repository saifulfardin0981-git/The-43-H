{% extends "base.html" %}

{% block title %}Login - UniPortal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-300 rounded-lg shadow-sm">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">University Portal</h2>
    <p class="text-gray-600 mb-8 text-center">Please sign in with your DIU student email to access the portal.</p>
    
    <a href="/api/auth/login" 
       class="w-full flex items-center justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        <img class="h-5 w-5 mr-2" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
        Sign in with Google
    </a>
    
    <div id="message" class="mt-4 text-center text-sm"></div>
</div>

<script>
    // Since the API returns the token as JSON on callback, 
    // we would usually need to handle the token retrieval.
    // For this simple demo, we'll assume the user is redirected back.
    // In a full implementation, the callback would redirect to /dashboard?token=...
    // and this script would pick it up.
    
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (token) {
        localStorage.setItem('token', token);
        window.location.href = '/dashboard';
    }
</script>
{% endblock %}
